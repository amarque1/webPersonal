<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0712" />
      <stop offset="60%" stop-color="#140d24" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>
    <linearGradient id="violet-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#C5FF3D" />
    </linearGradient>
    <linearGradient id="horizon-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a0712" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="500" fill="url(#bg-grad-2)" />

  <!-- Volumetric Moon / Celestial Body -->
  <circle cx="480" cy="160" r="110" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="10 5" stroke-opacity="0.4" />
  <circle cx="480" cy="160" r="95" fill="#1b122e" fill-opacity="0.6" stroke="#C5FF3D" stroke-width="1" stroke-opacity="0.3" />

  <!-- Distant Cyber Ruins / Monoliths (Silhouette) -->
  <polygon points="80,320 120,180 160,200 170,320" fill="#120c1e" />
  <polygon points="190,320 230,120 270,140 280,320" fill="#181028" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.4" />
  <polygon points="310,320 370,90 410,110 420,320" fill="#201535" stroke="#EC4899" stroke-width="0.75" stroke-opacity="0.3" />
  <polygon points="530,320 570,140 620,170 640,320" fill="#160e24" />
  <polygon points="660,320 700,210 730,230 750,320" fill="#120b1c" />

  <!-- Horizon Line & Glow -->
  <rect x="0" y="280" width="800" height="220" fill="url(#horizon-glow)" />
  <line x1="0" y1="320" x2="800" y2="320" stroke="#C5FF3D" stroke-width="1" stroke-opacity="0.7" />

  <!-- Perspective 3D Wireframe Grid (Terrain / Plaza) -->
  <g stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1">
    <!-- Horizon convergence rays -->
    <line x1="400" y1="320" x2="-200" y2="500" />
    <line x1="400" y1="320" x2="-50" y2="500" />
    <line x1="400" y1="320" x2="100" y2="500" />
    <line x1="400" y1="320" x2="250" y2="500" />
    <line x1="400" y1="320" x2="400" y2="500" stroke="#C5FF3D" stroke-opacity="0.6" stroke-width="1.5" />
    <line x1="400" y1="320" x2="550" y2="500" />
    <line x1="400" y1="320" x2="700" y2="500" />
    <line x1="400" y1="320" x2="850" y2="500" />
    <line x1="400" y1="320" x2="1000" y2="500" />

    <!-- Horizontal grid lines with perspective spacing -->
    <line x1="0" y1="330" x2="800" y2="330" stroke-opacity="0.2" />
    <line x1="0" y1="345" x2="800" y2="345" stroke-opacity="0.3" />
    <line x1="0" y1="365" x2="800" y2="365" stroke-opacity="0.4" />
    <line x1="0" y1="395" x2="800" y2="395" stroke-opacity="0.5" />
    <line x1="0" y1="435" x2="800" y2="435" stroke-opacity="0.6" stroke="#C5FF3D" />
    <line x1="0" y1="485" x2="800" y2="485" stroke-opacity="0.7" />
  </g>

  <!-- Foreground 3D Polygonal Obelisk (Textured / Wireframe Artifact) -->
  <g transform="translate(360, 180)">
    <polygon points="40,20 75,70 40,190 5,70" fill="#2d1c47" stroke="#C5FF3D" stroke-width="1.5" />
    <polygon points="40,20 75,70 40,190" fill="#442a6d" stroke="#8B5CF6" stroke-width="1.2" fill-opacity="0.7" />
    <polygon points="40,20 5,70 40,190" fill="#1b112d" stroke="#00F0FF" stroke-width="1.2" fill-opacity="0.7" />
    <circle cx="40" cy="100" r="12" fill="none" stroke="#C5FF3D" stroke-width="2" />
    <line x1="40" y1="75" x2="40" y2="125" stroke="#C5FF3D" stroke-width="1.5" />
  </g>

  <!-- Wireframe Level Design Polyhedral Nodes -->
  <circle cx="160" cy="200" r="3" fill="#C5FF3D" />
  <circle cx="270" cy="140" r="3" fill="#EC4899" />
  <circle cx="370" cy="90" r="4" fill="#00F0FF" />
  <circle cx="620" cy="170" r="3" fill="#8B5CF6" />

  <!-- Editorial Metadata Label -->
  <rect x="30" y="30" width="230" height="54" fill="#0c0a14" fill-opacity="0.85" stroke="#362254" stroke-width="1" rx="2" />
  <text x="42" y="48" fill="#EC4899" font-family="monospace" font-size="11" font-weight="bold">BLENDER 4.x // PBR SHADING</text>
  <text x="42" y="64" fill="#92949D" font-family="monospace" font-size="9">LIGHTING: VOLUMETRIC CYCLES</text>
  <text x="42" y="76" fill="#C5FF3D" font-family="monospace" font-size="9">POLY COUNT: 48,200 TRIS (LOD 0)</text>

  <rect x="580" y="420" width="190" height="50" fill="#0c0a14" fill-opacity="0.85" stroke="#362254" stroke-width="1" rx="2" />
  <text x="592" y="438" fill="#F1F0EA" font-family="monospace" font-size="10" font-weight="bold">NEO-RUINS: SECTOR 7</text>
  <text x="592" y="454" fill="#92949D" font-family="monospace" font-size="9">ENVIRONMENT ART &amp; LEVEL DESIGN</text>
</svg>
