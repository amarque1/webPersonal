<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#12151f" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="accent-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5FF3D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5FF3D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C5FF3D" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-pattern-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232938" stroke-width="0.75" stroke-dasharray="2 4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad-1)" />
  <rect width="800" height="500" fill="url(#grid-pattern-1)" />

  <!-- Central Glow -->
  <circle cx="400" cy="250" r="280" fill="url(#glow-1)" />

  <!-- Kinematic System / Vector Orbitals -->
  <circle cx="400" cy="250" r="160" fill="none" stroke="#2a3245" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="400" cy="250" r="110" fill="none" stroke="#C5FF3D" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="400" cy="250" r="60" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Trajectory Curves -->
  <path d="M 120 380 Q 280 120, 520 220 T 720 160" fill="none" stroke="url(#accent-lime)" stroke-width="2.5" />
  <path d="M 120 400 Q 300 200, 480 320 T 700 280" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="5 5" />

  <!-- Nodes & Physics Points -->
  <circle cx="120" cy="380" r="4" fill="#C5FF3D" />
  <circle cx="340" cy="180" r="6" fill="#00F0FF" />
  <circle cx="520" cy="220" r="5" fill="#C5FF3D" />
  <circle cx="720" cy="160" r="7" fill="#C5FF3D" />

  <!-- Vector indicators -->
  <line x1="340" y1="180" x2="380" y2="130" stroke="#C5FF3D" stroke-width="1.5" />
  <polygon points="380,130 373,135 378,142" fill="#C5FF3D" />
  <text x="390" y="135" fill="#C5FF3D" font-family="monospace" font-size="10" letter-spacing="1">v = 42.8 m/s</text>

  <!-- Wireframe Rig Box (Isometric Kinematic Player Controller) -->
  <g transform="translate(350, 190) scale(1.1)">
    <!-- 3D wireframe cube -->
    <polygon points="50,10 90,30 90,80 50,60" fill="#141a27" stroke="#00F0FF" stroke-width="1.2" fill-opacity="0.6" />
    <polygon points="50,10 10,30 10,80 50,60" fill="#182030" stroke="#C5FF3D" stroke-width="1.2" fill-opacity="0.6" />
    <polygon points="50,10 90,30 50,50 10,30" fill="#20293d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" fill-opacity="0.8" />
    <!-- Center coordinate axis -->
    <line x1="50" y1="50" x2="50" y2="15" stroke="#C5FF3D" stroke-width="1.5" />
    <line x1="50" y1="50" x2="80" y2="65" stroke="#00F0FF" stroke-width="1.5" />
    <line x1="50" y1="50" x2="20" y2="65" stroke="#8B5CF6" stroke-width="1.5" />
  </g>

  <!-- Telemetry HUD Elements -->
  <rect x="30" y="30" width="220" height="54" fill="#0c0e14" fill-opacity="0.85" stroke="#252b3a" stroke-width="1" rx="2" />
  <text x="42" y="48" fill="#C5FF3D" font-family="monospace" font-size="11" font-weight="bold">SYSTEM: TIME-DILATION ENGINE</text>
  <text x="42" y="64" fill="#92949D" font-family="monospace" font-size="9">DELTA_T: 0.016s // SCALE: 0.25x</text>
  <text x="42" y="76" fill="#00F0FF" font-family="monospace" font-size="9">COLLISION RESOLVER: CONTINUOUS</text>

  <rect x="610" y="420" width="160" height="50" fill="#0c0e14" fill-opacity="0.85" stroke="#252b3a" stroke-width="1" rx="2" />
  <text x="622" y="438" fill="#F1F0EA" font-family="monospace" font-size="10" font-weight="bold">UNITY 6 / C#</text>
  <text x="622" y="454" fill="#92949D" font-family="monospace" font-size="9">CUSTOM RIGIDBODY PIPELINE</text>

  <!-- Crosshairs and brackets -->
  <path d="M 20 20 L 35 20 M 20 20 L 20 35" stroke="#C5FF3D" stroke-width="2" fill="none" />
  <path d="M 780 20 L 765 20 M 780 20 L 780 35" stroke="#252b3a" stroke-width="2" fill="none" />
  <path d="M 20 480 L 35 480 M 20 480 L 20 465" stroke="#252b3a" stroke-width="2" fill="none" />
  <path d="M 780 480 L 765 480 M 780 480 L 780 465" stroke="#C5FF3D" stroke-width="2" fill="none" />
</svg>
