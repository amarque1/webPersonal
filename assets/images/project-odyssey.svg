<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e11" />
      <stop offset="50%" stop-color="#071b22" />
      <stop offset="100%" stop-color="#050a0e" />
    </linearGradient>
    <linearGradient id="cyan-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#C5FF3D" />
    </linearGradient>
    <radialGradient id="mesh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-3)" />
  <circle cx="400" cy="250" r="300" fill="url(#mesh-glow)" />

  <!-- Procedural Topographic Contours / Perlin Noise Contours -->
  <g fill="none" stroke-width="1.2">
    <!-- Contour lines -->
    <path d="M 60 420 C 140 380, 220 460, 320 400 S 520 320, 640 380 S 740 340, 780 320" stroke="#0e3a47" />
    <path d="M 60 380 C 150 330, 240 410, 340 350 S 500 270, 620 330 S 720 290, 780 270" stroke="#134e60" />
    <path d="M 60 340 C 160 280, 260 360, 360 300 S 480 220, 600 280 S 700 240, 780 220" stroke="#1c708a" />
    <path d="M 60 300 C 170 230, 280 310, 380 250 S 460 170, 580 230 S 680 190, 780 170" stroke="#00F0FF" stroke-opacity="0.7" />
    <path d="M 60 260 C 180 180, 300 260, 400 200 S 440 120, 560 180 S 660 140, 780 120" stroke="url(#cyan-lime)" stroke-width="2" />
    <path d="M 60 220 C 190 140, 320 210, 420 150 S 420 80, 540 130 S 640 90, 780 70" stroke="#C5FF3D" stroke-opacity="0.8" />
  </g>

  <!-- Node Graph / Shader Graph Overlay -->
  <g transform="translate(180, 80)">
    <!-- Node Box 1: Perlin Noise -->
    <rect x="0" y="20" width="130" height="70" fill="#09181e" stroke="#00F0FF" stroke-width="1" rx="4" />
    <text x="12" y="38" fill="#00F0FF" font-family="monospace" font-size="9" font-weight="bold">SIMPLEX_NOISE 3D</text>
    <text x="12" y="52" fill="#92949D" font-family="monospace" font-size="8">FREQ: 0.042</text>
    <text x="12" y="64" fill="#92949D" font-family="monospace" font-size="8">OCTAVES: 5</text>
    <circle cx="130" cy="55" r="4" fill="#00F0FF" />

    <!-- Node Box 2: Voronoi Biome -->
    <rect x="0" y="120" width="130" height="70" fill="#09181e" stroke="#8B5CF6" stroke-width="1" rx="4" />
    <text x="12" y="138" fill="#8B5CF6" font-family="monospace" font-size="9" font-weight="bold">VORONOI_CELLS</text>
    <text x="12" y="152" fill="#92949D" font-family="monospace" font-size="8">METRIC: EUCLIDEAN</text>
    <text x="12" y="164" fill="#92949D" font-family="monospace" font-size="8">BIOME WEIGHTS</text>
    <circle cx="130" cy="155" r="4" fill="#8B5CF6" />

    <!-- Connection Bezier Curves -->
    <path d="M 130 55 C 200 55, 200 95, 260 95" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <path d="M 130 155 C 200 155, 200 115, 260 115" fill="none" stroke="#8B5CF6" stroke-width="1.5" />

    <!-- Master Node Box: Compute Terrain Mesh -->
    <rect x="260" y="70" width="160" height="85" fill="#081419" stroke="#C5FF3D" stroke-width="1.2" rx="4" />
    <circle cx="260" cy="95" r="4" fill="#00F0FF" />
    <circle cx="260" cy="115" r="4" fill="#8B5CF6" />
    <text x="272" y="90" fill="#C5FF3D" font-family="monospace" font-size="9" font-weight="bold">MARCHING CUBES HLSL</text>
    <text x="272" y="106" fill="#F1F0EA" font-family="monospace" font-size="8">ISOVALUE: 0.500</text>
    <text x="272" y="120" fill="#92949D" font-family="monospace" font-size="8">COMPUTE SHADER DISPATCH</text>
    <text x="272" y="134" fill="#00F0FF" font-family="monospace" font-size="8">GPU CHUNKS: 64x64x64</text>
    <circle cx="420" cy="112" r="4" fill="#C5FF3D" />
  </g>

  <!-- Editorial Metadata Label -->
  <rect x="30" y="30" width="230" height="54" fill="#051014" fill-opacity="0.85" stroke="#163945" stroke-width="1" rx="2" />
  <text x="42" y="48" fill="#00F0FF" font-family="monospace" font-size="11" font-weight="bold">PROCEDURAL ENGINE // HLSL</text>
  <text x="42" y="64" fill="#92949D" font-family="monospace" font-size="9">INFINITY SEED: 0x7E3A9F</text>
  <text x="42" y="76" fill="#C5FF3D" font-family="monospace" font-size="9">FRAME TIME: 1.4ms (GPU)</text>

  <rect x="580" y="420" width="190" height="50" fill="#051014" fill-opacity="0.85" stroke="#163945" stroke-width="1" rx="2" />
  <text x="592" y="438" fill="#F1F0EA" font-family="monospace" font-size="10" font-weight="bold">VOXEL ODYSSEY</text>
  <text x="592" y="454" fill="#92949D" font-family="monospace" font-size="9">PROCEDURAL GENERATION</text>
</svg>
